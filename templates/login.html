<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popcorn | Login</title>
    <link rel="stylesheet" href="/static/login.css">
</head>

<body>
    <div class="popcorn-bg">
        <span class="popcorn-decoration popcorn-one">🍿</span>
        <span class="popcorn-decoration popcorn-two">🍿</span>
        <span class="popcorn-decoration popcorn-three">✦</span>
        <span class="popcorn-decoration popcorn-four">✧</span>

        <main class="login-box">

            <div class="logo">
                <span class="logo-icon">🍿</span>
            </div>

            <h1>Popcorn<span class="title-dot">.</span></h1>
            <p class="subtitle">Your people. Your conversations.</p>

            <form action="/login" method="POST">

                <label for="username">USERNAME</label>
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>

                <label for="roll">ROLL NUMBER</label>
                <div class="input-group">
                    <span class="icon">🎟️</span>
                    <input
                        type="text"
                        id="roll"
                        name="roll"
                        placeholder="Enter roll number"
                        required
                    >
                </div>

                <label for="password">PASSWORD</label>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    LET'S POP! <span>→</span>
                </button>

            </form>

            <p class="footer-text">
                GOOD CHATS. GREAT VIBES. 🍿
            </p>

        </main>
    </div>
</body>
</html>
